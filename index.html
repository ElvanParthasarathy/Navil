  <script>
    // Check if the site is running inside an iframe (like inside your OS)
    if (window.self !== window.top) {
      const customScrollbarStyle = document.createElement('style');
      customScrollbarStyle.innerHTML = `
        /* Custom CSS Scrollbars for embedded OS mode */
        ::-webkit-scrollbar {
          width: 6px;
          height: 6px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background-color: rgba(156, 163, 175, 0.5);
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: rgba(156, 163, 175, 0.8);
        }
        html.dark ::-webkit-scrollbar-thumb {
          background-color: rgba(100, 116, 139, 0.5);
        }
        html.dark ::-webkit-scrollbar-thumb:hover {
          background-color: rgba(100, 116, 139, 0.8);
        }
      `;
      document.head.appendChild(customScrollbarStyle);
    }
  </script>

</head>

<body>
  <!-- Blocking script to prevent theme flicker and font flashes -->
  <style>
    html.fonts-loading #root {
      opacity: 0;
    }
    html.fonts-loaded #root {
      opacity: 1;
      transition: opacity 0.4s ease;
    }
  </style>
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'auto';
      let effectiveTheme = theme;
      if (theme === 'auto') {
        effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', effectiveTheme);

      // Prevent font FOIT/FOUT by waiting for fonts
      document.documentElement.classList.add('fonts-loading');
      document.fonts.ready.then(() => {
        document.documentElement.classList.remove('fonts-loading');
        document.documentElement.classList.add('fonts-loaded');
      });
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
